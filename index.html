<form id="userForm">
    <label>
        Name
        <input type="text" id="name" required>
    </label>

    <label>
        Email
        <input type="email" id="email" required>
    </label>

    <label>
        Role
        <select id="role">
            <option value="member">Member</option>
            <option value="Host">Host</option>
        </select>
    </label>

<button type="submit">Create User</button>


</form>
<p id="message"></p>

</body>

</html>
