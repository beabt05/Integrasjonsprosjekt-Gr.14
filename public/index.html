<!-- Login form for existing users to sign in through the backend endpoint. -->
<li class="nav-login">
  <form class="nav-login-form" id="navAuthForm" method="POST" action="/register">
    <input type="email" name="email" placeholder="Email"
           required autocomplete="email">

    <input type="password" name="password" id="navPassword"
           placeholder="Passord" required autocomplete="current-password">

    <button type="submit" id="navAuthBtn">Login</button>
  </form>

  <div class="nav-login-toggle">
    <button type="button" id="navToRegister">Ikke registrert enna?</button>
    <button type="button" id="navToLogin" hidden>Allerede registrert?</button>
  </div>

  <p id="navAuthMessage" role="status"></p>
</li>

<!-- Study session form used to arrange a study meeting. -->
<div class="container">  
  <form id="contact" action="" method="post">
    <h3>Study Buddy</h3>
    <h4>Arranger en studieøkt</h4>
    <fieldset>
      <input placeholder="Vertsnavn" type="text" tabindex="1" required autofocus>
    </fieldset>
    <fieldset>
      <input placeholder="E-postadresse" type="email" tabindex="2" required>
    </fieldset>
       <fieldset>
      <input placeholder="date" type="date" tabindex="2" required>
    </fieldset>
<fieldset>
    <select name="course-code" multiple = "multiple">
        <option value="" disabled selected>Emne kode og kurs navn</option>
        <option value="IDG2052">IDG2052 Programmering</option>
        <option value="IDATG2208">IDATG2208 Machine Learning</option>
        <option value="IDATG2102">IDATG2102 Alogrithmic Methods</option>
       
    </select>
</fieldset>
    <fieldset>
                 <textarea placeholder="Skriv gruppesesjonsbeskrivelsen her..." tabindex="5" required></textarea>
    </fieldset>
    <fieldset>
      <button name="submit" type="submit" id="contact-submit" data-submit="...Sending">send inn</button>
    </fieldset>
  </form>
 
  
</div>

  

</body>
