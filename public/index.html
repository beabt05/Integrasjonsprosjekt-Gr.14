<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">

<head>
    <title>Form</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">

</head>

<body>
<dialog id="authModal">
<div class="container" id="authBar">
<br>
<h1>Study Buddy</h1>
<br>
<li class="nav-login">
  <form class="nav-login-form" id="navAuthForm">
    <input type="text" name="username" id="navUsername"
       placeholder="Brukernavn" autocomplete="username"
       minlength="2" maxlength="50" hidden disabled>
    <input type="email" name="email" id="navEmail"
       placeholder="E-postadresse" required autocomplete="email">
    <input type="password" name="password" id="navPassword"
           placeholder="Passord" required autocomplete="current-password">

    <button type="submit" id="navAuthBtn">Login</button>
  </form>

  <div class="nav-login-toggle">
    <span id="navToRegister">Ikke registrert enna?</span>
    <span type="button" id="navToLogin" hidden>Allerede registrert?</span>
    <span type="button" id="forgottrnPassword" hidden>Glemte passord?</span>
    <p id="navAuthMessage" role="status"></p>
  </div>
  
</li>
</div>
</dialog>


<main id="mainScreen" hidden>
  <p id="navAuthMessage" role="status"></p>
  <p id="welcomeMessage"></p>
<div class="container">
  <form id="contact">
    <h1>Study Buddy</h1>
    <h4>Arranger en studieøkt</h4>
    <fieldset>
      <input id="session-titel" name="tittel" placeholder="Tittel på studieøkten" type="text" maxlength="100" required autofocus>
    </fieldset>
    <fieldset class="session-row">
      <div>
        <label for="session-start">Starttid</label>
        <input id="session-start" name="starttid" type="time" required>
      </div>
      <div>
        <label for="session-capacity">Maks deltakere</label>
        <input id="session-capacity" name="maks_deltakere" type="number" min="1" value="3" required>
      </div>
    </fieldset>
    <fieldset>
      <label for="session-date">Dato</label>
      <input id="session-date" name="dato" type="date" required>
    </fieldset>
    <fieldset>
      <select id="course-code-num" name="course-code" required>
        <option value="" disabled selected>Emne kode og kurs navn</option>
        <option value="IDG2052">IDG2052 Programmering</option>
        <option value="IDATG2208">IDATG2208 Machine Learning</option>
        <option value="IDATG2102">IDATG2102 Alogrithmic Methods</option>
      </select>
    </fieldset>
    <fieldset>
      <input id="bygningNo" class="bygning" placeholder="Bygning" type="text" maxlength="10">
    </fieldset>
    <fieldset>
      <input name="rom" placeholder="Rom" type="text" maxlength="10">
    </fieldset>
    <fieldset>
      <button name="submit" type="submit" id="contact-submit" data-submit="...Sending">send inn</button>
    </fieldset>
    <p id="session-message" role="status"></p>
    <div id="session-list"></div>
  </form>

  <button type="button" class="btn btn-sm" id="clearAll" name="button">clear all</button>
</div>
