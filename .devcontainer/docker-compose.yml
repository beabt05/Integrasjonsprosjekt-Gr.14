services:
  app:
    image: mcr.microsoft.com/devcontainers/universal:2
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
      - db

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: local_root_password
      MARIADB_DATABASE: study_buddy
      MARIADB_USER: study_user
      MARIADB_PASSWORD: local_dev_password
    volumes:
      - database-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    environment:
      PMA_HOST: db
    depends_on:
      - db


volumes:
  database-data: