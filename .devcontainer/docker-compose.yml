# Shared development environment: MariaDB and phpMyAdmin.
# Used automatically by Codespaces through devcontainer.json.
# Teammates can alternatively use their own local database setup.
# Use database/schema.sql for the shared table structure,
# and configure application database connections in your own .env.


services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:22
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
      - db

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: local_root_password
      MARIADB_DATABASE: study_buddy
      MARIADB_USER: study_user
      MARIADB_PASSWORD: local_dev_password
    volumes:
      - database-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    environment:
      PMA_HOST: db
    depends_on:
      - db


volumes:
  database-data: